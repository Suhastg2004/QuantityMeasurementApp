<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantity Measurement App</title>
    <!-- Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header class="top-banner text-center">
        <h1 class="main-title mb-0">Welcome To Quantity Measurement</h1>
    </header>

    <!-- Bootstrap container -->
    <main class="container py-4">

        <!-- Type section -->
        <section class="mb-5">
            <h2 class="section-title">Choose Type</h2>

            <!-- Bootstrap grid: row + cols -->
            <div class="row g-4">
                <div class="col-12 col-sm-6 col-lg-3">
                    <!-- Bootstrap card component -->
                    <button class="card type-card active w-100 h-100 border-0 shadow-sm" type="button"
                        data-category="length">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                            <div class="icon-box mb-3">
                                <img src="https://img.icons8.com/color/50/ruler.png" alt="Length" class="type-icon" />
                            </div>
                            <span class="type-label">Length</span>
                        </div>
                    </button>
                </div>

                <div class="col-12 col-sm-6 col-lg-3">
                    <!-- Bootstrap card component -->
                    <button class="card type-card w-100 h-100 border-0 shadow-sm" type="button" data-category="weight">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                            <div class="icon-box mb-3">
                                <img src="https://img.icons8.com/color/50/scales.png" alt="Weight" class="type-icon" />
                            </div>
                            <span class="type-label">Weight</span>
                        </div>
                    </button>
                </div>

                <div class="col-12 col-sm-6 col-lg-3">
                    <!-- Bootstrap card component -->
                    <button class="card type-card w-100 h-100 border-0 shadow-sm" type="button"
                        data-category="temperature">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                            <div class="icon-box mb-3">
                                <img src="https://img.icons8.com/color/50/thermometer.png" alt="Temperature"
                                    class="type-icon" />
                            </div>
                            <span class="type-label">Temperature</span>
                        </div>
                    </button>
                </div>

                <div class="col-12 col-sm-6 col-lg-3">
                    <!-- Bootstrap card component -->
                    <button class="card type-card w-100 h-100 border-0 shadow-sm" type="button" data-category="volume">
                        <div class="card-body d-flex flex-column justify-content-center align-items-center text-center">
                            <div class="icon-box mb-3">
                                <img src="https://img.icons8.com/color/50/measuring-cup.png" alt="Volume"
                                    class="type-icon" />
                            </div>
                            <span class="type-label">Volume</span>
                        </div>
                    </button>
                </div>
            </div>
        </section>

        <!-- Action section -->
        <section class="mb-5">
            <h2 class="section-title">Choose Action</h2>

            <!-- Bootstrap button group -->
            <div class="btn-group w-100 action-row" role="group" aria-label="Action selection">
                <button type="button" class="btn action-btn active">Comparison</button>
                <button type="button" class="btn action-btn">Conversion</button>
                <button type="button" class="btn action-btn">Arithmetic</button>
            </div>
        </section>

        <!-- Conversion section -->
        <!-- Bootstrap grid: 2 columns -->
        <section class="row g-4">
            <div class="col-12 col-md-6">
                <!-- Bootstrap form components -->
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <label class="form-label field-title" for="from-unit">From</label>

                        <!-- Bootstrap input -->
                        <input class="form-control value-input mb-3" type="number" step="any" value="1"
                            aria-label="From value" />

                        <!-- Bootstrap select -->
                        <select class="form-select unit-select" id="from-unit">
                            <option selected>Kilometer</option>
                            <option>Meters</option>
                            <option>Centimeters</option>
                            <option>Millimeters</option>
                            <option>Mile</option>
                            <option>Yard</option>
                            <option>Feet</option>
                            <option>Inch</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6">
                <!-- Bootstrap form components -->
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <label class="form-label field-title" for="to-unit">To</label>

                        <!-- Bootstrap input -->
                        <input class="form-control value-input mb-3" type="text" value="1000" aria-label="To value"
                            readonly />

                        <!-- Bootstrap select -->
                        <select class="form-select unit-select" id="to-unit">
                            <option>Kilometer</option>
                            <option selected>Meters</option>
                            <option>Centimeters</option>
                            <option>Millimeters</option>
                            <option>Mile</option>
                            <option>Yard</option>
                            <option>Feet</option>
                            <option>Inch</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
</body>

</html>
